name: Deploy to babadum.xyz

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy files via rsync
        run: |
          rsync -avz --delete \
            -e "ssh -i ~/.ssh/deploy_key -p ${{ secrets.SSH_PORT || 22 }}" \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='node_modules' \
            --exclude='.DS_Store' \
            ./ \
            ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }}:/var/www/babadum.xyz/

      - name: Restart Python server
        run: |
          ssh -i ~/.ssh/deploy_key -p 22 \
            ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }} \
            'cd /var/www/babadum.xyz && \
             pkill -f "python.*server.py" || true && \
             nohup python3 server.py > server.log 2>&1 &'

      - name: Cleanup
        if: always()
        run: rm -f ~/.ssh/deploy_key

      - name: Deployment notification
        run: echo "✅ Successfully deployed to babadum.xyz and restarted server"

name: Deploy to babadum.xyz

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy files via rsync
        run: |
          rsync -avz --delete \
            -e "ssh -i ~/.ssh/deploy_key -p ${{ secrets.SSH_PORT || 22 }}" \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='node_modules' \
            --exclude='.DS_Store' \
            --exclude='__pycache__' \
            --exclude='*.pyc' \
            --exclude='*.log' \
            --exclude='/data/library/.crawler.lock' \
            --exclude='/data/library/*.pid' \
            --exclude='/data/library/.workers/' \
            --exclude='/data/library/media/audio/' \
            --exclude='*.tmp' \
            --filter='P /data/library/***' \
            ./ \
            ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }}:/var/www/babadum.xyz/

      - name: Create config.js with API key
        run: |
          ssh -i ~/.ssh/deploy_key -p 22 \
            ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }} \
            "echo 'var Config = { deepl: { apiKey: \"${{ secrets.DEEPL_API_KEY }}\", useFreeApi: true } };' > /var/www/babadum.xyz/config.js"

      - name: Restart Python server
        run: |
          ssh -i ~/.ssh/deploy_key -p 22 \
            ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }} \
            'systemctl restart babadum'

      - name: Cleanup
        if: always()
        run: rm -f ~/.ssh/deploy_key

      - name: Deployment notification
        run: echo "✅ Successfully deployed to babadum.xyz and restarted server"
